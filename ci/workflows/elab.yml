# elab-flow 的 GitHub Actions 工作流（L5）
#
# ★ 本工作流调用的是同一份 ci/matrix.yaml —— 本地 `elab ci` 与云端因此行为一致，
#   不在 workflow 里另写一遍流程。
#
# ★ 本文件有【两份、必须逐字一致】的副本：
#     .github/workflows/elab.yml   ← GitHub 实际执行（只认这个目录）
#     ci/workflows/elab.yml        ← 仓库内定义源（便于阅读 / 复制到别的仓库）
#   工作流第一步会 diff 两者，不一致直接红灯 —— 把"双源漂移"变成显式约束。

name: elab-flow

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 主机门禁：纯编译类，云端 runner 可跑 ────────────────────────
  host-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 工作流双源一致性守卫
        shell: bash
        run: |
          if diff -u ci/workflows/elab.yml .github/workflows/elab.yml; then
            echo "✓ ci/workflows/elab.yml 与 .github/workflows/elab.yml 一致"
          else
            echo "✗ 两份 workflow 已漂移 —— 请同步后再推"
            exit 1
          fi

      - name: 主机依赖（ninja / cmake）
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake

      # ★ 切勿加 --no-install-recommends：Debian/Ubuntu 的 gcc-arm-none-eabi
      #   把 newlib（含 nano.specs、stdio.h）放在 **Recommends** 里。
      #   精简安装后：configure 能过（CMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY 不做链接），
      #   但链接期报 `cannot read spec file 'nano.specs'` → 不产出 .elf（假绿/真炸）。
      - name: 交叉工具链（arm-none-eabi-gcc + newlib）
        run: |
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib

      - name: 切换到 CI 版主机配置（L0）
        shell: bash
        run: |
          cp ci/host.ci.yaml elab.host.yaml
          chmod +x ./elab

      - name: 环境体检（诊断用，失败不阻断）
        shell: bash
        run: ./elab doctor || true

      # 用重定向而非管道拿退出码（管道会吞码；shell: bash 虽含 pipefail，此处更直白）
      - name: 跑主机门禁
        id: gate
        shell: bash
        run: |
          set +e
          ./elab ci --job host-gate --json > ci-host.json 2> ci-host.err
          rc=$?
          echo "----- ci-host.json -----"; cat ci-host.json
          echo "----- ci-host.err  -----"; cat ci-host.err
          exit $rc

      # 把失败步骤转成 check-run 注解 —— 无需 token 即可通过 GitHub API 读取
      - name: 失败摘要注解
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          try:
              d = json.load(open('ci-host.json', encoding='utf-8'))
          except Exception as e:
              print(f"::error::无法解析 ci-host.json：{e}")
              raise SystemExit(0)
          for j in d.get('jobs', []):
              for p in j.get('projects', []):
                  for s in p.get('steps', []):
                      if not s.get('ok'):
                          det = ' '.join(str(s.get('detail', '')).split())[:1500]
                          print(f"::error::[{j['job']}/{p['project']}/{s['step']}] {det}")
          PY

      # ★ 产物文件名**按工程而定**（at32_test → TEST.elf，at32f421g8u7 → AT32F421G8U7.elf），
      #   所以这里**不许写死 glob**：早先的 `.work/*/TEST.*` 会让新工程构建绿、
      #   固件却静默传不上来（`if-no-files-found: warn` 不报错）。接入新工程现在
      #   **不需要改 workflow** —— 路径由 `elab ci --json` 的 build 步骤自报。
      - name: 收集固件产物（按 CI 报告自报的路径）
        if: always()
        shell: bash
        env:
          GATE: ${{ steps.gate.outcome }}
        run: |
          python3 - <<'PY'
          import json, os, shutil

          # 门禁本身失败时"没有产物"是必然的、且已被上面的注解报过 → 只提示，不重复报错。
          soft = os.environ.get("GATE", "") != "success"

          try:
              d = json.load(open("ci-host.json", encoding="utf-8"))
          except Exception as e:
              print(f"::warning::读不到 ci-host.json（{e}），跳过产物收集")
              raise SystemExit(0)

          os.makedirs("ci-firmware", exist_ok=True)
          copied, missing = 0, []
          for job in d.get("jobs", []):
              for proj in job.get("projects", []):
                  for st in proj.get("steps", []):
                      if st.get("step") != "build" or not st.get("ok"):
                          continue
                      for kind, art in (st.get("artifacts") or {}).items():
                          src = (art or {}).get("path") or ""
                          if src and os.path.isfile(src):
                              dst = "ci-firmware/{}.{}".format(
                                  proj["project"], os.path.basename(src))
                              shutil.copy2(src, dst)
                              copied += 1
                          else:
                              missing.append("{} / {} → {}".format(
                                  proj["project"], kind, src or "(未自报)"))

          print("收集到 {} 个产物：".format(copied))
          for f in sorted(os.listdir("ci-firmware")):
              print("  {}  {} B".format(f, os.path.getsize(os.path.join("ci-firmware", f))))
          for m in missing:
              print("::error::声明了产物却未生成：{}".format(m))

          bad = bool(missing) or copied == 0
          if not bad:
              raise SystemExit(0)
          if soft:
              print("::warning::门禁未通过，产物缺失属预期，不重复报错")
              raise SystemExit(0)
          # ★ 门禁绿、却一个产物都没有 → 这正是"假绿"，必须红灯。
          raise SystemExit(1)
          PY

      - name: 上传固件产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          # ci-firmware/ 非隐藏目录，故这里**不需要** include-hidden-files
          path: ci-firmware/
          if-no-files-found: warn

      - name: 上传 CI 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-host-report
          path: |
            ci-host.json
            ci-host.err
          if-no-files-found: warn

  # ── 上板门禁：需要真实探针，必须 self-hosted ─────────────────────
  # 默认不跑：云端 runner 没有探针。
  # 仅当【手动触发 workflow_dispatch】且仓库变量 ENABLE_ONHW=true 时运行 ——
  # 否则"派发了却没有 self-hosted runner"会让任务永远排队。
  onhw-gate:
    if: github.event_name == 'workflow_dispatch' && vars.ENABLE_ONHW == 'true'
    runs-on: [self-hosted, atlink]
    steps:
      - uses: actions/checkout@v4
      - name: 跑上板门禁（烧录 + 断到 main）
        shell: bash
        run: |
          set +e
          chmod +x ./elab
          ./elab ci --onhw --job onhw-gate --json > ci-onhw.json 2> ci-onhw.err
          rc=$?
          cat ci-onhw.json ci-onhw.err
          exit $rc
      - name: 上传 CI 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-onhw-report
          path: ci-onhw.json
          if-no-files-found: warn

  # ── 前端产物守卫：dist/ 入库，必须与源码同步 ─────────────────────
  # 为什么需要它：`cockpit/web/dist/` 是**提交入仓**的（运行时零 Node，Python 直接托管），
  # 于是"改了源码忘了重建 dist"会静默上线一个旧界面 —— 本地怎么点都正常，
  # 因为本地跑的是 dev server。本 job 重建一遍并比对，把"忘了重建"变成红灯。
  #
  # ★ Node 版本用主版本号（22）而非精确版本：精确版本在 runner 上未必可用，
  #   一旦取不到则本守卫**永久无法运行**（比误红更糟）。若哪天因 Node 小版本差异
  #   导致 dist 逐字不同而误红，按提示在 cockpit/web 下重建并提交 dist/ 即可 ——
  #   那正是本守卫想让你做的事。
  web-dist-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cockpit/web/package-lock.json

      - name: 安装依赖（严格按锁文件）
        working-directory: cockpit/web
        run: npm ci

      # = tsc --noEmit && vite build —— 顺带把类型检查也变成门禁
      - name: 重建前端产物
        working-directory: cockpit/web
        run: npm run build

      - name: 校验 dist/ 与源码同步
        shell: bash
        run: |
          if git diff --exit-code cockpit/web/dist/; then
            echo "✓ cockpit/web/dist/ 与源码一致（可复现）"
          else
            echo "::error::cockpit/web/dist/ 与源码不同步 —— 请在 cockpit/web 下执行 npm run build，并把 dist/ 一并提交"
            exit 1
          fi
