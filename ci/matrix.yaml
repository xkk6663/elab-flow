# ci/matrix.yaml —— CI 矩阵（L5）
#
# 本地 `elab ci` 与 GitHub Actions 共用【同一份定义】——不在两处各写一遍流程，
# 否则"本地绿、CI 红"这类问题会反复出现。
#
# 一档 job = 一组「项目 × 检查步骤」。分两档是刻意的：
#   host-gate  纯主机可跑（编译类）→ 云端 runner 也能跑
#   onhw-gate  需要真实探针      → 必须 self-hosted，且可选

version: 1

defaults:
  build_type: Debug
  jobs: 4                 # 传给 cmake --build -j

jobs:
  # ── 档 1：主机门禁（无探针依赖）────────────────────────────────
  - name: host-gate
    desc: 环境体检 + 深度漂移校验 + 编译（云端可跑）
    # ★ 云端只跑随仓可得的芯片（官方源 st/stm32）：
    #   内核**一次只启用一套适配包**（packs/installed/active.json），
    #   而 at32 是外置仓库、只能走市场索引安装 —— 放进云端门禁就要联网下载外置包，
    #   且与 st 工程无法在同一次运行里同时生效。at32 的编译/烧录由 onhw-gate
    #   （self-hosted，本机已装包）覆盖。
    projects: [STM32F103C8T6]
    steps:
      - doctor_deep       # 真跑 configure，校验实际编译命令与 chip.yaml 一致
      - build             # 编译 + 统一产出 hex/bin + 零改动快照
    # ★ 产物路径**刻意不在这里写**：它由 `projects/<name>.yaml` 的 artifacts 段声明，
    #   由 `elab ci --json` 的 build 步骤**自报**（含 path/bytes），工作流据此收集上传。
    #   早先这里写过 ".work/{project}/TEST.*" —— 那个字段是死的（`ci.py` 从不读它），
    #   而且对 at32f421g8u7（产物叫 AT32F421G8U7.*）**是错的**：会让云端跑绿、
    #   固件却静默传不上来。接入新工程现在**不需要改 workflow**。
    runner: ubuntu-latest

  # ── 档 2：上板门禁（需要探针，self-hosted）─────────────────────
  - name: onhw-gate
    desc: 烧录 + 断到 main 自检（需要探针接在机器上）
    projects: [at32f421g8u7]
    steps:
      - flash
      - debug_verify
    optional: true        # 云端无探针；缺 runner 时跳过而非失败
    runner: [self-hosted, atlink]
