# projects/at32f421g8u7_workbench.yaml —— 项目接入层（L4）
# BLDC 电调台架（SguanESC）+ OTA 平台化（Bootloader 18K + APP 44K + 元数据页）。
# （初版由 `elab adapt` 生成，本版为人工接管：补 flash.images / link_channel /
#   真实 monitor 判据；删去 generated-by 标记后 elab 不再覆盖本文件。）
#
# 接入证据：
#   CMakeLists.txt:22   include("cmake/gcc-arm-none-eabi.cmake")   → B 类（行内工具链）
#   CMakeLists.txt:19   set(CMAKE_PROJECT_NAME AT32F421G8U7_WorkBench)
#   CMakeLists.txt:45   add_subdirectory(bootloader)               → 双镜像构建
#   AT32F421x8_APP.ld   FLASH 0x08004800/44K  RAM 16K              → APP 区
#   bootloader/AT32F421x8_BOOT.ld  FLASH 0x08000000/18K            → Boot 区
#   project/src/main.c:146-147,162  LOG_INFO + 1s 心跳             → 串口判据依据
#
# ★ C33：本工程是 elab 首个「OTA 双镜像」项目——flash.images 声明烧录序列；
#   build.link_channel: c_flags 使 inject 盖章走 CMAKE_C_LINK_FLAGS 通道，
#   让 bootloader/CMakeLists:15 的 string(REPLACE ...) 防身在 elab 接管下继续生效
#   （否则 EXE 通道盖章的 -T APP.ld 会与 target 的 -T BOOT.ld 形成双 -T = M1 坑）。

name: at32f421g8u7_workbench
root: ${ELAB_ROOT}/examples/AT32F421G8U7_WorkBench
chip: artery/at32f421g8
archetype: B

build:
  kind: cmake
  source: ${root}/CMakeLists.txt
  work_dir: ${ELAB_ROOT}/.work/at32f421g8u7_workbench
  generator: Ninja
  toolchain_file:  ${ELAB_ROOT}/toolchains/gcc.cmake
  project_include: ${ELAB_ROOT}/toolchains/inject.cmake
  linker_script:   ${root}/AT32F421x8_APP.ld        # APP 链接脚本（ld 归工程所有）
  build_type: Debug
  project_name: AT32F421G8U7_WorkBench
  # C33 盖章通道：B 类必须走 c_flags（理由见本文件头注释与 docs/设计约束.md C33）
  link_channel: c_flags

artifacts:
  elf: ${work_dir}/AT32F421G8U7_WorkBench.elf
  hex: ${work_dir}/AT32F421G8U7_WorkBench.hex
  bin: ${work_dir}/AT32F421G8U7_WorkBench.bin
  map: ${work_dir}/AT32F421G8U7_WorkBench.map

# ── OTA 双镜像烧录（C33）──────────────────────────────────────────
# 顺序即 program 顺序：先 Boot 后 App，一次 openocd 会话，末尾 reset run。
# ★ M2 教训（业务工程 CMakeLists 注释实锤）：APP 禁止用 elf 直接烧 ——
#   openocd program app.elf 从 0x08004000 起擦（向下对齐），覆盖 Bootloader
#   尾部 2KB。必须 bin + 显式地址 0x08004800。
# boot elf 由 add_subdirectory(bootloader) 的 target 产出（Ninja 单配置：
#   $<TARGET_FILE:at32f421_boot> = <work_dir>/bootloader/at32f421_boot.elf）。
# app bin 由 elab 统一 objcopy（C6），与工程 POST_BUILD 同路径同内容。
flash:
  images:
    - path: ${work_dir}/bootloader/at32f421_boot.elf
      format: elf                                     # 地址由 elf 自带
      ld: ${root}/bootloader/AT32F421x8_BOOT.ld       # 仅供 doctor 镜像级对账
    - path: ${work_dir}/AT32F421G8U7_WorkBench.bin
      format: bin
      address: "0x08004800"                           # APP 区起点（Boot 18K 之后）

debug:
  probe: atlink
  # 镜像模式下 elab 的 debug 自动跳过 gdb `load`（C33：load 有同样的
  # 向下擦除风险，且 loop 顺序 flash 在 debug 前，固件已在位）。
  gdb_script: ${ELAB_ROOT}/toolchains/gdb/break_main.gdb

guard:
  untouched: true
  snapshot: true
  snapshot_root: ${root}

# ── 串口闭环判据（证据：log/log.c printf("[%s][%lu] %s\r\n")）──────
serial:
  baud: 115200          # USART1，main.c:147 自述
  port: auto            # 自动选口：跳过蓝牙虚拟口

monitor:
  close_on:
    # 启动横幅（main.c:146）：`[I][123] === SguanESC 电调固件启动 ===`
    - { kind: regex, pattern: "电调固件启动", within_s: 10 }
    # 1s 心跳（main.c:162）：`[I][456] heartbeat tick=789 high_loop=...`
    - { kind: regex, pattern: "heartbeat tick=", within_s: 15 }
  fail_on:
    # 崩溃现场（crash/crash.c:78）：`*** CRASH *** pc=... lr=...`
    - { kind: regex, pattern: "CRASH|HardFault|PANIC" }
  idle_timeout_s: 30

# ── 证据链（adapt 初版探测 + 人工核实）────────────────────────────
provenance:
  vendor: "artery（at32_workbench）"
  archetype: "B —— CMakeLists.txt:22 行内 include 自带工具链"
  project_name: "AT32F421G8U7_WorkBench —— CMakeLists.txt:19"
  toolchain_cmake: "cmake/gcc-arm-none-eabi.cmake —— 行内 include（接管后仍执行）"
  linker_script: "AT32F421x8_APP.ld（FLASH 0x08004800/44K）—— 工程根，接管目标脚本"
  compile_flags: "-mcpu=cortex-m4 -mfloat-abi=soft —— 工具链 TARGET_FLAGS"
  chip_macro: "AT32F421G8U7 —— bootloader/CMakeLists.txt:56"
  boot_image: "bootloader/at32f421_boot.elf —— BOOT_TARGET（FLASH 0x08000000/18K）"
  stdout: "有输出能力 —— at32f421_int.c:279 __io_putchar（Allman 定义体）+ log/log.c printf"
  confidence: "high"
  serial_pins: "USART1 TX=PB6 RX=PB7 @115200"
