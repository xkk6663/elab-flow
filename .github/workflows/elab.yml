# elab-flow 的 GitHub Actions 工作流（L5）
#
# ★ 本工作流调用的是同一份 ci/matrix.yaml —— 本地 `elab ci` 与云端因此行为一致，
#   不在 workflow 里另写一遍流程。
#
# ★ 本文件有【两份、必须逐字一致】的副本：
#     .github/workflows/elab.yml   ← GitHub 实际执行（只认这个目录）
#     ci/workflows/elab.yml        ← 仓库内定义源（便于阅读 / 复制到别的仓库）
#   工作流第一步会 diff 两者，不一致直接红灯 —— 把"双源漂移"变成显式约束。

name: elab-flow

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 主机门禁：纯编译类，云端 runner 可跑 ────────────────────────
  host-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 工作流双源一致性守卫
        shell: bash
        run: |
          if diff -u ci/workflows/elab.yml .github/workflows/elab.yml; then
            echo "✓ ci/workflows/elab.yml 与 .github/workflows/elab.yml 一致"
          else
            echo "✗ 两份 workflow 已漂移 —— 请同步后再推"
            exit 1
          fi

      - name: 主机依赖（ninja / cmake）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build cmake

      - name: 交叉工具链（arm-none-eabi-gcc）
        run: |
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi

      - name: 切换到 CI 版主机配置（L0）
        shell: bash
        run: |
          cp ci/host.ci.yaml elab.host.yaml
          chmod +x ./elab

      - name: 环境体检（诊断用，失败不阻断）
        shell: bash
        run: ./elab doctor || true

      # ★ shell: bash 展开为 `bash -eo pipefail`，故 | tee 不会吞掉 elab 的退出码。
      #   若不加 pipefail，CI 失败时会显示成绿灯（假绿）。
      - name: 跑主机门禁
        shell: bash
        run: ./elab ci --job host-gate --json | tee ci-host.json

      - name: 上传固件产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: .work/*/TEST.*
          if-no-files-found: warn

      - name: 上传 CI 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-host-report
          path: ci-host.json
          if-no-files-found: warn

  # ── 上板门禁：需要真实探针，必须 self-hosted ─────────────────────
  # 默认不跑：云端 runner 没有探针。
  # 仅当【手动触发 workflow_dispatch】且仓库变量 ENABLE_ONHW=true 时运行 ——
  # 否则"派发了却没有 self-hosted runner"会让任务永远排队。
  onhw-gate:
    if: github.event_name == 'workflow_dispatch' && vars.ENABLE_ONHW == 'true'
    runs-on: [self-hosted, atlink]
    steps:
      - uses: actions/checkout@v4
      - name: 跑上板门禁（烧录 + 断到 main）
        shell: bash
        run: |
          chmod +x ./elab
          ./elab ci --onhw --job onhw-gate --json | tee ci-onhw.json
      - name: 上传 CI 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-onhw-report
          path: ci-onhw.json
          if-no-files-found: warn
