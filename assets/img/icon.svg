<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="elab cockpit">
  <!-- 驾驶舱图标（与仓库根 cockpit.ico 同源）：
       暗底圆角方块 #17202E + 绿色脉搏线 #34D399。
       几何由 cockpit.ico 的 48px 帧逐像素拟合得来（圆角半径 12 / 线宽 5.5），
       矢量重绘以便任意尺寸清晰。改这里要同步改仓库根的 cockpit.ico。 -->
  <rect x="0" y="0" width="48" height="48" rx="12" fill="#17202e"/>
  <path d="M4.5 21 H17.75 L21.25 34 L24 9.25 L27 21.5 H32 L34.5 25.75 L37 20.5 H43.25"
        fill="none" stroke="#34d399" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
